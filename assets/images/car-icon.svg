<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 180" width="100" height="180">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8001f"/>
      <stop offset="30%" stop-color="#ff1e42"/>
      <stop offset="70%" stop-color="#ff1e42"/>
      <stop offset="100%" stop-color="#b8001f"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101726"/>
      <stop offset="50%" stop-color="#1c2940"/>
      <stop offset="100%" stop-color="#0b111c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <rect x="22" y="16" width="56" height="152" rx="18" fill="rgba(0,0,0,0.5)"/>

  <!-- Tires -->
  <rect x="15" y="35" width="10" height="26" rx="4" fill="#141416"/>
  <rect x="75" y="35" width="10" height="26" rx="4" fill="#141416"/>
  <rect x="15" y="120" width="10" height="26" rx="4" fill="#141416"/>
  <rect x="75" y="120" width="10" height="26" rx="4" fill="#141416"/>

  <!-- Main Chassis -->
  <rect x="24" y="14" width="52" height="152" rx="16" fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- Dual Racing Stripes -->
  <rect x="44" y="14" width="4" height="152" fill="#ffffff"/>
  <rect x="52" y="14" width="4" height="152" fill="#ffffff"/>

  <!-- Windshield -->
  <rect x="30" y="55" width="40" height="34" rx="8" fill="url(#glassGrad)"/>

  <!-- Rear Window -->
  <rect x="33" y="112" width="34" height="22" rx="6" fill="#0b111c"/>

  <!-- Spoiler -->
  <rect x="20" y="150" width="60" height="9" rx="3" fill="#111215"/>

  <!-- Headlights -->
  <rect x="28" y="16" width="9" height="6" rx="2" fill="#ffffff"/>
  <rect x="63" y="16" width="9" height="6" rx="2" fill="#ffffff"/>

  <!-- Taillights -->
  <rect x="26" y="159" width="12" height="5" rx="2" fill="#ff1e42"/>
  <rect x="62" y="159" width="12" height="5" rx="2" fill="#ff1e42"/>
</svg>
